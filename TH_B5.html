<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thẻ sản phẩm - Product Card</title>
  <link rel="stylesheet" href="style_1.css">
</head>
<body>

  <div class="box">
    <div class="product-card">
      <img src="https://thoitrangbigsize.vn/wp-content/uploads/2025/11/3-21-1.jpg" alt="Quần Bò Hồng Kông">
      <span class="badge-sale">Sale 25%</span>
      <button class="btn-heart">❤️</button>

      <div class="product-info">
        <h3>Quần Bò Hồng Kông</h3>
        <p class="desc">Quần Bò Cở Lớn Hồng Kông Dáng Rộng</p>
        <p class="price">300.000đ <del>400.000đ</del></p>
        <button class="btn-buy">Thêm vào giỏ</button>
      </div>
    </div>
  </div>

</body>
</html>
